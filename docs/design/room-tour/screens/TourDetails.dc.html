<head>

<x-dc>
<helmet>

<style>

a{color:#32743C}a:hover{color:#172C27}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 411px; height: 891px; box-sizing: border-box; background: #FFFFFF; font-family: Roboto, sans-serif; color: #172C27; position: relative; overflow: hidden">
  <div style="position: relative; height: 300px; background: #CFE3D4">
    <svg width="100%" height="100%" viewBox="0 0 411 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Property photo 1 of 8, placeholder" style="display: block">
      <rect width="411" height="300" fill="#DDEBDF"></rect><rect y="212" width="411" height="88" fill="#B9D3BC"></rect>
      <circle cx="58" cy="196" r="40" fill="#8DB894"></circle><circle cx="360" cy="190" r="46" fill="#8DB894"></circle>
      <polygon points="110,110 205,50 300,110" fill="#5C4B3E"></polygon><rect x="124" y="108" width="162" height="112" fill="#FBFAF6"></rect>
      <rect x="142" y="128" width="36" height="32" fill="#9CC2D9"></rect><rect x="232" y="128" width="36" height="32" fill="#9CC2D9"></rect><rect x="191" y="160" width="28" height="60" fill="#7A5C44"></rect>
    </svg>
    <button aria-label="Back" style="position: absolute; top: 24px; left: 16px; width: 48px; height: 48px; border-radius: 100px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#172C27" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <span style="position: absolute; right: 16px; bottom: 40px; height: 28px; padding: 0 12px; border-radius: 100px; background: rgba(23,44,39,0.78); color: #FFFFFF; font-size: 12px; font-weight: 500; display: flex; align-items: center">1 / 8 photos</span>
  </div>

  <div style="position: relative; margin-top: -24px; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 18px 16px 0 16px; display: flex; flex-direction: column; gap: 18px">

    <a href="#tour" aria-label="Open 360° room tour, front and back side" style="text-decoration: none; color: #172C27; display: flex; align-items: center; gap: 12px; border: 1px solid #DCE5DD; border-radius: 16px; padding: 8px 14px 8px 8px; min-height: 72px; box-sizing: border-box">
      <span style="position: relative; width: 120px; height: 56px; border-radius: 10px; overflow: hidden; flex: none; background: #E8E1D6">
        <svg width="100%" height="100%" viewBox="0 0 240 112" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block">
          <rect width="240" height="112" fill="#E8E1D6"></rect><rect y="80" width="240" height="32" fill="#C9B79C"></rect>
          <rect x="20" y="18" width="70" height="44" fill="#BFD8E6"></rect><rect x="140" y="26" width="34" height="54" fill="#9C7B5B"></rect>
        </svg>
        <span style="position: absolute; left: 6px; top: 6px; height: 22px; padding: 0 8px; border-radius: 100px; background: rgba(23,44,39,0.82); color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center">360°</span>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">Look around the room</span>
        <span style="font-size: 13px; color: #606A63">Front and back side</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#172C27" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="align-self: flex-start; height: 28px; padding: 0 12px; border-radius: 100px; background: #EDF8EE; color: #256030; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 10px; background: #32743C"></span>Available Dec 1</span>
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">2-bedroom townhouse with carport</h1>
      <span style="font-size: 14px; color: #606A63">Anabu II-A, Imus, Cavite</span>
    </div>
    <div style="height: 120px; border-radius: 16px; border: 1px dashed #C3CEC5; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #606A63">Rest of rental details · unchanged</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #DCE5DD; padding: 12px 16px 20px 16px; display: flex; align-items: center; gap: 14px">
    <div style="display: flex; flex-direction: column"><span style="font-size: 20px; line-height: 26px; font-weight: 800">₱18,500</span><span style="font-size: 12px; color: #606A63">per month</span></div>
    <button style="flex: 1; height: 54px; border-radius: 100px; border: 0; background: #32743C; color: #FFFFFF; font-size: 16px; font-weight: 600">Request to reserve</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":411,"height":891}}'>

  renderVals() { return {}; }

</html>
