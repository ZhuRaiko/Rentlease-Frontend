        <span style="position: absolute; left: 10px; bottom: 10px; height: 28px; padding: 0 12px; border-radius: 100px; background: rgba(255,255,255,0.95); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px">

        </span>
        <button aria-label="Front side options" style="position: absolute; top: 4px; right: 4px; width: 48px; height: 48px; border-radius: 100px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">

        <span style="width: 36px; height: 36px; border-radius: 100px; background: #32743C; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #DCE5DD; padding: 12px 16px 20px 16px">
    <button style="width: 100%; height: 54px; border-radius: 100px; border: 0; background: #32743C; color: #FFFFFF; font-size: 16px; font-weight: 600">Save listing details</button>
  </div>
</div>
