<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room tour viewer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#7CC587}a:hover{color:#FFFFFF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 411px; height: 891px; box-sizing: border-box; background: #0F1A16; font-family: Roboto, sans-serif; color: #FFFFFF; position: relative; overflow: hidden">
  <div style="position: absolute; top: 0; left: 0; right: 0; padding: 20px 16px; display: flex; align-items: center; gap: 12px; z-index: 2">
    <button aria-label="Close room tour" style="width: 48px; height: 48px; border-radius: 100px; border: 0; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </button>
    <span style="font-size: 17px; font-weight: 600">Room tour</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 160px; height: 460px; overflow: hidden">
    <svg width="2000" height="460" viewBox="0 0 2000 460" role="img" aria-label="Front side panorama. Drag left or right to look around." style="display: block; margin-left: -520px">
      <rect width="2000" height="460" fill="#E8E1D6"></rect>
      <rect y="340" width="2000" height="120" fill="#C9B79C"></rect>
      <rect x="640" y="0" width="4" height="340" fill="#D6CDBF"></rect><rect x="1380" y="0" width="4" height="340" fill="#D6CDBF"></rect>
      <rect x="180" y="80" width="300" height="180" fill="#BFD8E6"></rect><rect x="326" y="80" width="8" height="180" fill="#FFFFFF"></rect>
      <rect x="880" y="110" width="140" height="230" fill="#9C7B5B"></rect><circle cx="1000" cy="230" r="6" fill="#E8D3A8"></circle>
      <rect x="1120" y="250" width="70" height="90" fill="#A9825F"></rect><circle cx="1155" cy="230" r="46" fill="#7FA985"></circle>
      <rect x="1480" y="200" width="50" height="160" fill="#7A6450"></rect><rect x="1480" y="260" width="420" height="96" fill="#FFFFFF"></rect><rect x="1520" y="236" width="90" height="34" rx="10" fill="#E9EEF2"></rect>
      <rect x="720" y="140" width="110" height="70" fill="#5F7F6B"></rect>
    </svg>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 28px 16px; display: flex; flex-direction: column; align-items: center; gap: 18px">
    <span role="img" aria-label="Viewing about 30% from the left" style="width: 140px; height: 4px; border-radius: 10px; background: rgba(255,255,255,0.25); position: relative; display: block">
      <span style="position: absolute; left: 30%; width: 36px; height: 4px; border-radius: 10px; background: #FFFFFF; display: block"></span>
    </span>
    <div role="tablist" aria-label="Side" style="display: flex; padding: 4px; border-radius: 100px; background: rgba(255,255,255,0.14); width: 100%; box-sizing: border-box">
      <button role="tab" aria-selected="true" style="flex: 1; height: 48px; border-radius: 100px; border: 0; background: #FFFFFF; color: #172C27; font-size: 15px; font-weight: 600">Front side</button>
      <button role="tab" aria-selected="false" style="flex: 1; height: 48px; border-radius: 100px; border: 0; background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 500">Back side</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":411,"height":891}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
