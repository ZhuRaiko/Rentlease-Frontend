<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room tour · owner states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#32743C}a:hover{color:#172C27}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 411px; height: 891px; box-sizing: border-box; background: #F7F9F5; font-family: Roboto, sans-serif; color: #172C27; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 24px 16px">

  <span style="font-size: 13px; font-weight: 600; color: #606A63">Uploading</span>
  <section style="background: #FFFFFF; border: 1px solid #DCE5DD; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 17px; line-height: 23px; font-weight: 600">360° room tour</h2>
    <div style="position: relative; height: 96px; border-radius: 14px; overflow: hidden; background: #E8E1D6">
      <svg width="100%" height="100%" viewBox="0 0 600 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block; opacity: 0.45">
        <rect width="600" height="120" fill="#E8E1D6"></rect><rect y="88" width="600" height="32" fill="#C9B79C"></rect>
        <rect x="56" y="20" width="96" height="52" fill="#BFD8E6"></rect><rect x="270" y="28" width="42" height="60" fill="#9C7B5B"></rect>
        <rect x="452" y="68" width="120" height="26" fill="#FFFFFF"></rect>
      </svg>
      <div style="position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600">Uploading front side · 60%</span>
        <span role="progressbar" aria-label="Upload progress" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="height: 6px; border-radius: 10px; background: rgba(255,255,255,0.9); display: block; overflow: hidden"><span style="display: block; width: 60%; height: 6px; background: #32743C"></span></span>
      </div>
    </div>
    <button disabled style="height: 96px; border-radius: 14px; border: 2px dashed #C3CEC5; background: #F7F9F5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #68716A; padding: 0">
      <span style="width: 36px; height: 36px; border-radius: 100px; background: #DCE5DD; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#68716A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
      <span style="font-size: 14px; font-weight: 600">Add back side</span>
    </button>
  </section>

  <span style="font-size: 13px; font-weight: 600; color: #606A63; margin-top: 8px">Something went wrong (one tile, one tap)</span>
  <section style="background: #FFFFFF; border: 1px solid #DCE5DD; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 17px; line-height: 23px; font-weight: 600">360° room tour</h2>
    <button style="min-height: 96px; border-radius: 14px; border: 1px solid #EBC4C4; background: #FBEEEE; display: flex; align-items: center; gap: 12px; padding: 14px; text-align: left; color: #172C27">
      <span style="width: 36px; height: 36px; border-radius: 100px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B2C2C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5M12 16.5v.5"></path><circle cx="12" cy="12" r="9"></circle></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 15px; font-weight: 600; color: #9B2C2C">This photo isn’t wide enough</span>
        <span style="font-size: 13px; line-height: 19px; color: #4F5B54">Use Panorama mode and sweep slowly. Tap to pick another.</span>
      </span>
    </button>
    <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 19px; color: #4F5B54; background: #F7F9F5; border-radius: 12px; padding: 10px 12px">
      <span style="font-weight: 600; color: #172C27">Same tile, other messages</span>
      <span>Too large: “This file is over 15 MB. Tap to pick a smaller one.”</span>
      <span>Upload failed: “Couldn’t upload. Tap to try again.”</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":411,"height":891}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
